# Same bounded demo as deploy/demo.yaml, with placement on sensor-selected nodes.
apiVersion: v1
kind: Namespace
metadata:
  name: falco-demo
  labels:
    app.kubernetes.io/part-of: falco-tiered-lab
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-demo-network
  namespace: falco-demo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: Pod
metadata:
  name: falco-lab
  namespace: falco-demo
  labels:
    app.kubernetes.io/part-of: falco-tiered-lab
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    security-lab: enabled
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: demo
      image: docker.io/library/busybox:1.37.0
      imagePullPolicy: Always
      command: [/bin/sleep, '1800']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: falco-maintenance
  namespace: falco-demo
  labels:
    app.kubernetes.io/part-of: falco-tiered-lab
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    security-lab: enabled
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: demo
      image: docker.io/library/busybox:1.37.0
      imagePullPolicy: Always
      command: [/bin/sleep, '1800']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
