name: Falco rules and offline triage checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test offline alert routing and input handling
        run: python -m unittest discover -s tests -v
      - name: Demonstrate synthetic alert triage
        run: python -m lab.triage fixtures/alerts.jsonl
      - name: Compile rules with native Falco without capture privileges
        run: sh ci/validate-rules.sh
