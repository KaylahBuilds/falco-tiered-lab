# Keep this file independent of upstream macros and Tier 1.
- rule: Lab Shell Outside Maintenance Exception
  desc: Detect a shell start in the demo pods except the exact maintenance tuple.
  condition: >
    evt.type in (execve, execveat) and evt.failed = false
    and container.id != host
    and k8s.ns.name = falco-demo
    and k8s.pod.name in (falco-lab, falco-maintenance)
    and proc.name in (sh, ash, bash, dash)
  exceptions:
    - name: approved_demo_maintenance
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: [=, =, =]
      values:
        - [falco-demo, falco-maintenance, sh]
  output: >
    Lab shell requires review (process=%proc.name namespace=%k8s.ns.name
    pod=%k8s.pod.name container_id=%container.id user=%user.uid)
  priority: WARNING
  source: syscall
  tags: [lab, tier2, shell]
