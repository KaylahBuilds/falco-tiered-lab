# Self-contained teaching rule; no dependency on upstream macros.
- rule: Lab Marker Process Started
  desc: Observe successful true or false marker executions in the two demo pods.
  condition: >
    evt.type in (execve, execveat) and evt.failed = false
    and container.id != host
    and k8s.ns.name = falco-demo
    and k8s.pod.name in (falco-lab, falco-maintenance)
    and proc.name in (true, false)
  output: >
    Lab marker started (process=%proc.name namespace=%k8s.ns.name
    pod=%k8s.pod.name container_id=%container.id user=%user.uid)
  priority: NOTICE
  source: syscall
  tags: [lab, tier1, visibility]
